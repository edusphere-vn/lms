<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edusphere LMS - Admin</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5b6672; --line:#e3e7ec; --accent:#1a56db; --ok:#067647; --err:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --card:#1d2227; --ink:#eef1f4; --muted:#9aa6b2; --line:#2c333a; --accent:#6ea0ff; --ok:#4ade80; --err:#ff8a80; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
    header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { font-size:17px; margin:0; flex:1; }
    nav { display:flex; gap:6px; padding:12px 16px; flex-wrap:wrap; }
    nav button { padding:7px 14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; cursor:pointer; font:inherit; }
    nav button[aria-current="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
    main { padding:0 16px 40px; }
    .bar { display:flex; gap:8px; align-items:center; margin:8px 0 12px; flex-wrap:wrap; }
    .bar h2 { margin:0; font-size:16px; flex:1; }
    button.p { padding:7px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button.s { padding:5px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
    .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
    table { border-collapse:collapse; width:100%; min-width:560px; }
    th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { color:var(--muted); font-weight:600; font-size:13px; }
    tr:last-child td { border-bottom:0; }
    td.act { display:flex; gap:6px; }
    .empty { padding:24px; color:var(--muted); }
    dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:min(440px, calc(100vw - 32px)); padding:20px; }
    dialog::backdrop { background:rgba(0,0,0,.4); }
    dialog h3 { margin:0 0 8px; font-size:16px; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 3px; }
    input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:transparent; color:inherit; }
    input[type=checkbox] { width:auto; }
    .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .note { color:var(--muted); font-size:13px; }
    .msg { min-height:1.4em; font-size:14px; margin-top:8px; }
    .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
    dialog.wide { width:min(1100px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; }
    label.inline { display:flex; gap:8px; align-items:center; color:var(--ink); font-size:14px; margin:6px 0; }
    h4 { margin:14px 0 6px; font-size:14px; }
    tr.flagged td { background:color-mix(in srgb, var(--err) 8%, transparent); }
    .flag { display:inline-block; margin:1px 4px 1px 0; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--muted); }
    .flag.check { border-color:var(--err); color:var(--err); }
    /* luoi lich */
    .gtabs { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 8px; }
    .gtab { padding:5px 12px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; cursor:pointer; font:inherit; }
    .gtab[aria-current="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
    .gtool { margin:4px 0 8px; }
    .gridwrap { overflow:auto; max-height:68vh; border:1px solid var(--line); border-radius:10px; background:var(--card); outline:none; }
    .gridwrap:focus-visible { box-shadow:0 0 0 2px var(--accent); }
    table.grid { border-collapse:separate; border-spacing:0; width:100%; min-width:900px; table-layout:fixed; user-select:none; }
    table.grid th, table.grid td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0 6px; height:26px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    table.grid thead th { position:sticky; top:0; background:var(--card); z-index:2; text-align:center; }
    table.grid th.tm { width:58px; color:var(--muted); font-weight:500; text-align:center; position:sticky; left:0; background:var(--card); z-index:1; }
    td.cell { position:relative; cursor:cell; }
    td.cell.esl { background:#9fc5e8; color:#0b2540; } td.cell.ielts { background:#f4c7c3; color:#4a1410; }
    td.cell.na { background:#980000; color:#fff; } td.cell.res { background:#ffe94d; color:#3a3000; } td.cell.plain { background:#e6e9ee; color:#1b1f24; }
    td.cell.sel { box-shadow:inset 0 0 0 2px var(--accent); } td.cell.focus { box-shadow:inset 0 0 0 3px var(--accent); }
    td.cell.sel:not(.focus)::after { content:""; position:absolute; inset:0; background:color-mix(in srgb, var(--accent) 18%, transparent); pointer-events:none; }
    td.cell.conflict { outline:2px solid #d92d20; outline-offset:-2px; }
    td.cell.fillprev { outline:2px dashed var(--accent); outline-offset:-2px; background-image:repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,.08) 4px 8px); }
    .cellinput { position:absolute; inset:0; width:100%; height:100%; border:2px solid var(--accent); border-radius:0; padding:0 6px; font:inherit; background:var(--card); color:var(--ink); }
    .fh { position:absolute; right:-4px; bottom:-4px; width:9px; height:9px; background:var(--accent); border:1px solid #fff; cursor:crosshair; z-index:3; }
    button.danger { color:var(--err); border-color:var(--err); } button.p.danger { background:var(--err); color:#fff; border:0; }
    .checklist { max-height:180px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:4px 10px; }
    .info { margin-top:12px; border-top:1px solid var(--line); padding-top:6px; }
    table.mini { min-width:0; font-size:13px; } table.mini td { padding:3px 8px; border:0; }
    .info ul { margin:4px 0; padding-left:20px; font-size:14px; }
    code { background:var(--bg); padding:1px 6px; border-radius:6px; user-select:all; }
  </style>
</head>
<body>
<header><h1>Edusphere LMS · Admin</h1><span id="who" class="note"></span><button class="s" id="out">Đăng xuất</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
