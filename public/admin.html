<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edusphere LMS - Admin</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5b6672; --line:#e3e7ec; --accent:#1a56db; --ok:#067647; --err:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --card:#1d2227; --ink:#eef1f4; --muted:#9aa6b2; --line:#2c333a; --accent:#6ea0ff; --ok:#4ade80; --err:#ff8a80; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
    header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { font-size:17px; margin:0; flex:1; }
    nav { display:flex; gap:6px; padding:12px 16px; flex-wrap:wrap; }
    nav button { padding:7px 14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; cursor:pointer; font:inherit; }
    nav button[aria-current="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
    main { padding:0 16px 40px; }
    .bar { display:flex; gap:8px; align-items:center; margin:8px 0 12px; flex-wrap:wrap; }
    .bar h2 { margin:0; font-size:16px; flex:1; }
    button.p { padding:7px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button.s { padding:5px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
    .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
    table { border-collapse:collapse; width:100%; min-width:560px; }
    th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { color:var(--muted); font-weight:600; font-size:13px; }
    tr:last-child td { border-bottom:0; }
    td.act { display:flex; gap:6px; }
    .empty { padding:24px; color:var(--muted); }
    dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:min(440px, calc(100vw - 32px)); padding:20px; }
    dialog::backdrop { background:rgba(0,0,0,.4); }
    dialog h3 { margin:0 0 8px; font-size:16px; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 3px; }
    input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:transparent; color:inherit; }
    input[type=checkbox] { width:auto; }
    .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .note { color:var(--muted); font-size:13px; }
    .msg { min-height:1.4em; font-size:14px; margin-top:8px; }
    .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
    code { background:var(--bg); padding:1px 6px; border-radius:6px; user-select:all; }
  </style>
</head>
<body>
<header><h1>Edusphere LMS · Admin</h1><span id="who" class="note"></span><button class="s" id="out">Đăng xuất</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
