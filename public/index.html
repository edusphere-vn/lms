<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edusphere LMS - Đăng nhập</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:16px; }
    main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
    form button { width:100%; margin-top:20px; padding:10px; background:var(--accent); border:1px solid var(--accent); color:#fff; border-radius:var(--r-sm); font-weight:600; cursor:pointer; }
    form button:hover { background:var(--accent-ink); }
    .msg { color:var(--err); }
  </style>
</head>
<body>
<main>
  <section id="login">
    <h1>Edusphere LMS</h1>
    <p class="sub">Đăng nhập bằng tên đăng nhập do admin cấp.</p>
    <form id="loginForm">
      <label for="username">Tên đăng nhập</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Đăng nhập</button>
      <div id="loginMsg" class="msg" role="alert"></div>
    </form>
  </section>
  <section id="change" hidden>
    <h1>Đổi mật khẩu</h1>
    <p class="sub">Đây là lần đăng nhập đầu tiên. Hãy đặt mật khẩu mới (ít nhất 8 ký tự).</p>
    <form id="changeForm">
      <label for="newPassword">Mật khẩu moi</label>
      <input id="newPassword" type="password" autocomplete="new-password" required>
      <label for="newPassword2">Nhập lại mật khẩu mới</label>
      <input id="newPassword2" type="password" autocomplete="new-password" required>
      <button type="submit">Lưu mật khẩu</button>
      <div id="changeMsg" class="msg" role="alert"></div>
    </form>
  </section>
</main>
<script type="module" src="assets/login.js"></script>
</body>
</html>
